# 免费额度数据表：每条 offer 一个 YAML 条目
# ============================ 字段说明 ============================
# id / provider / website / docs        厂商名与链接
# region                                可用地区与网络要求
# signup                                注册方法和手段
# models                                覆盖的模型
# offer.type                            免费层 | 试用金 | 签到积分 | 限时活动 | 一次性赠送
# offer.requests_day / rpm              请求上限
# offer.tokens_day / tokens_month       token 上限
# offer.credits_usd / valid_months      一次性金额（美元）与摊销月数
# offer.checkin_tokens_day              每日签到送 tokens
# offer.points_monthly / points_daily   签到积分制
# offer.expiry                          截止日期 YYYY-MM-DD
# restrictions                          使用限制
# est_usd_per_mtok                      用于折算的官方付费价（$/百万 tokens）
# value_override_usd                    人工指定的折算月价值（覆盖自动计算）
# verified / confidence                 核查日期 YYYY-MM-DD ｜ high/medium/low
# ================================================================

