name: weekly refresh

on:
  schedule:
    - cron: "0 2 * * 1"      # 每周一 02:00 UTC（北京 10:00）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-ai-credits-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml requests
      - name: Scan offers & rebuild README
        run: python -m src.main
      - name: Commit snapshot
        run: |
          git config user.name "free-ai-credits-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m " weekly scan $(date -u +%Y-%m-%d)"
            git push
          fi
