name: 📮 订阅 / 退订邮件
description: 输入你的邮箱，每周五接收免费额度周报（10:00 北京时间）/ Weekly Friday digest opt-in
labels: ["subscribe"]
body:
  - type: dropdown
    id: action
    attributes:
      label: 动作 / Action
      options:
        - 订阅 / Subscribe
        - 退订 / Unsubscribe
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 邮箱 / Email
      placeholder: you@example.com
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        📅 **发送频率**：每周五（10:00 北京时间）一封《免费额度周报》，无每日推送。
  - type: markdown
    attributes:
      value: |
        🔒 **隐私说明**：你的邮箱以 AES-256 加密存在本仓库（`data/subscribers.enc`），
        **任何人（包括维护者）打不开明文**，只有打包线工作在运行时才能解密发送。
        机器人会在处理后的几十秒内自动**脱敏本 issue 的标题和正文**（明文不长期公开）；
        仓库 watcher 的实时通知邮件会含原文（当前仅维护者一人）。
        ⚠️ 无后台服务器，不做二次点击确认——发件箱仅用于发送，请勿回复该邮箱。
        退订随时可用本表单把动作切到「退订」。
